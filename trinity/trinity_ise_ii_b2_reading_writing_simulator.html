        // User answers store keyed by examId

        function getStorageKey(examId) {
            return `trinity_ise2_state_${examId}`;
        }

        function loadUserState(examId) {
            try {
                const raw = localStorage.getItem(getStorageKey(examId));
                if (raw) {
                    userStore[examId] = JSON.parse(raw);
                    return;
                }
            } catch (e) {
                console.warn("LocalStorage unavailable:", e);
            }
            userStore[examId] = {
                task1: {}, // keys: q1..q15
                task2: {}, // keys: q16..q30
                task3: "",
                task4: ""
            };
        }

        function saveUserState() {
            const exam = EXAM_DATABASE[currentExamIndex];
            try {
                localStorage.setItem(getStorageKey(exam.id), JSON.stringify(userStore[exam.id]));
                const indicator = document.getElementById("saveIndicator");
                indicator.classList.remove("opacity-0");
                clearTimeout(window._saveToastTimeout);
                window._saveToastTimeout = setTimeout(() => {
                    indicator.classList.add("opacity-0");
                }, 1500);
            } catch (e) {
                console.warn("Could not save to localStorage:", e);
            }
            updateTabBadges();
        }

        function countWords(str) {
            if (!str || !str.trim()) return 0;
            return str.trim().split(/\s+/).length;
        }

        /**
         * ============================================================================
         * TIMER LOGIC (120:00 COUNTDOWN)
         * ============================================================================
         */
        function formatTime(totalSec) {
            const mins = Math.floor(totalSec / 60);
            const secs = totalSec % 60;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!timerRunning) return;
                if (timerSeconds > 0) {
                    timerSeconds--;
                    updateTimerUI();
                } else {
                    clearInterval(timerInterval);
                    evaluateExam(true);
                }
            }, 1000);
        }

        function updateTimerUI() {
            const display = document.getElementById("timerDisplay");
            const box = document.getElementById("timerBox");
            display.textContent = formatTime(timerSeconds);
            if (timerSeconds <= 600) { // Last 10 mins warning
                display.classList.add("text-rose-400");
                box.classList.add("border-rose-500");
            } else {
                display.classList.remove("text-rose-400");
                box.classList.remove("border-rose-500");

        function getWordCountBadgeClass(count) {
            if (count === 0) return "bg-slate-200 text-slate-600";
            if (count >= 150 && count <= 180) return "bg-emerald-100 text-emerald-800 border border-emerald-300";
            if ((count >= 135 && count < 150) || (count > 180 && count <= 195)) return "bg-amber-100 text-amber-800 border border-amber-300";
            return "bg-rose-100 text-rose-800 border border-rose-300";
        }

        /**
         * ============================================================================
         * AUTOMATED GRADING & SIMULATED AI EXAMINER ENGINE
         * ============================================================================
         */
        function normalizeTextAnswer(str) {
            return (str || "").toLowerCase().trim().replace(/[.,!?;:'"()]/g, "").replace(/\s+/g, " ");
        }

        function evaluateWritingHeuristic(text, isTask3, expectedKeywords = []) {
            const wc = countWords(text);
            const paragraphs = text.trim() ? text.trim().split(/\n+/).filter(p => p.trim().length > 0).length : 0;
            const lower = text.toLowerCase();

            // Check B2 cohesive devices / linking words
            const linkers = ["however", "moreover", "furthermore", "on the other hand", "consequently", "therefore", "in addition", "although", "despite", "in conclusion", "to sum up", "firstly", "secondly", "for instance", "for example"];
            const usedLinkers = linkers.filter(l => lower.includes(l));

            // Check Task 2 synthesis keywords (for Task 3)
            const matchedKeywords = isTask3 ? expectedKeywords.filter(k => lower.includes(k.toLowerCase())) : [];

            if (wc < 20) {
                return {
                    band: "0 / 4 (Insufficient text)",
                    tf: 0, org: 0, lang: 0,
                    feedback: ["Response is too short or empty to be assessed by the examiner."]
                };
            }

            // Simulate Trinity 0-4 rubric scores
            let tf = 3;
            let org = 3;
            let lang = 3;
            const feedback = [];

            // Word count compliance check
            if (wc >= 150 && wc <= 180) {
                feedback.push(`✓ Word count (${wc} words) is strictly within the official 150–180 word range.`);
                tf = 4;
            } else if (wc < 150) {
                feedback.push(`⚠ Under length (${wc} words). Trinity penalises texts below 150 words under Task Fulfilment.`);
                tf = wc < 120 ? 1 : 2;
            } else {
                feedback.push(`⚠ Over length (${wc} words). Examiners stop reading or penalise texts exceeding 180 words.`);
                tf = wc > 205 ? 2 : 3;
            }

            // Synthesis check for Task 3
            if (isTask3) {
                if (matchedKeywords.length >= 4) {
                    feedback.push(`✓ Good synthesis of Task 2 source concepts (${matchedKeywords.slice(0, 5).join(", ")}).`);
                } else {
                    feedback.push(`⚠ Limited integration of facts from Texts A–D. Ensure you synthesize data and arguments from all four sources.`);
                    tf = Math.max(1, tf - 1);
                }
            }

            // Organisation & linking check
            if (paragraphs >= 3 && usedLinkers.length >= 2) {
                org = 4;
                feedback.push(`✓ Well-structured into ${paragraphs} paragraphs with B2 cohesive devices (${usedLinkers.join(", ")}).`);
            } else {
                org = paragraphs < 2 ? 2 : 3;
                feedback.push(`⚠ Improve paragraphing (${paragraphs} detected) and include more B2 linking expressions (e.g., However, Furthermore, Consequently).`);
            }

            // Basic language variety heuristic (average word length & sentence count)
            const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 0).length;
            const avgSentenceLen = sentences > 0 ? Math.round(wc / sentences) : wc;
            if (avgSentenceLen >= 12 && avgSentenceLen <= 26) {
                lang = 3;
                feedback.push(`✓ Good sentence complexity (avg. ${avgSentenceLen} words/sentence). Connect a real Gemini AI API key to run deep grammar & lexical error highlighting.`);
            } else {
                lang = 2;
                feedback.push(`⚠ Sentence length average is ${avgSentenceLen} words—aim for a balanced mix of complex and compound B2 sentences.`);
            }

            const avgScore = ((tf + org + lang) / 3).toFixed(1);
            let gradeLabel = "Pass";
            if (avgScore >= 3.5) gradeLabel = "Distinction";
            else if (avgScore >= 2.7) gradeLabel = "Merit";
            else if (avgScore < 2.0) gradeLabel = "Below B2 (Fail)";

            return {
                band: `${gradeLabel} (Avg ${avgScore}/4.0)`,
                tf, org, lang,
                feedback
            };
        }

        function evaluateExam(autoSubmitted = false) {
            const exam = EXAM_DATABASE[currentExamIndex];
            const state = userStore[exam.id];

            // 1. Grade Reading (30 objective questions)
            let readingScore = 0;
            const readingDetails = [];

            // Task 1 Q1-5
            exam.task1.questions1_5.forEach(item => {
                const u = state.task1[`q${item.q}`] || "";
                const ok = u === item.answer;
                if (ok) readingScore++;
                readingDetails.push({ q: item.q, task: "Task 1", user: u || "—", correct: item.answer, ok, explanation: item.explanation });
            });
            // Task 1 Q6-10
            exam.task1.questions6_10.forEach(item => {
                const u = state.task1[`q${item.q}`] || "";
                const ok = u === item.answer;
                if (ok) readingScore++;
                readingDetails.push({ q: item.q, task: "Task 1", user: u || "—", correct: item.answer, ok, explanation: item.explanation });
            });
            // Task 1 Q11-15
            exam.task1.questions11_15.forEach(item => {
                const u = state.task1[`q${item.q}`] || "";
                const normU = normalizeTextAnswer(u);
                const ok = item.answer.some(ans => normalizeTextAnswer(ans) === normU);
                if (ok) readingScore++;
                readingDetails.push({ q: item.q, task: "Task 1", user: u || "—", correct: item.answer[0], ok, explanation: item.explanation });
            });

            // Task 2 Q16-20
            exam.task2.questions16_20.forEach(item => {
                const u = state.task2[`q${item.q}`] || "";
                const ok = u === item.answer;
                if (ok) readingScore++;
                readingDetails.push({ q: item.q, task: "Task 2", user: u || "—", correct: item.answer, ok, explanation: item.explanation });
            });
            // Task 2 Q21-25
            exam.task2.questions21_25.forEach(item => {
                const u = state.task2[`q${item.q}`] || "";
                const ok = u === item.answer;
                if (ok) readingScore++;
                readingDetails.push({ q: item.q, task: "Task 2", user: u || "—", correct: item.answer, ok, explanation: item.explanation });
            });
            // Task 2 Q26-30
            exam.task2.questions26_30.forEach(item => {
                const u = state.task2[`q${item.q}`] || "";
                const normU = normalizeTextAnswer(u);
                const ok = item.answer.some(ans => normalizeTextAnswer(ans) === normU);
                if (ok) readingScore++;
                readingDetails.push({ q: item.q, task: "Task 2", user: u || "—", correct: item.answer[0], ok, explanation: item.explanation });
            });

            // Reading Grade Classification (Trinity scale approximation out of 30)
            let readingGrade = "Below B2 (Fail)";
            if (readingScore >= 25) readingGrade = "Distinction";
            else if (readingScore >= 20) readingGrade = "Merit";
            else if (readingScore >= 15) readingGrade = "Pass";

            // 2. Grade Writing Tasks 3 & 4
            const eval3 = evaluateWritingHeuristic(state.task3, true, exam.task3.expectedKeywords);
            const eval4 = evaluateWritingHeuristic(state.task4, false);

            // Render Modal Report
            document.getElementById("reportExamTitle").textContent = `${exam.title}${autoSubmitted ? " (Time Expired — Auto-Submitted)" : ""}`;
            const reportContent = document.getElementById("reportContent");

            reportContent.innerHTML = `
                <!-- Top Summary Cards -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-4">
                        <div class="text-xs font-bold uppercase text-slate-500">Reading Score (Tasks 1 & 2)</div>
                        <div class="text-3xl font-extrabold text-slate-900 mt-1">${readingScore} <span class="text-base font-normal text-slate-500">/ 30</span></div>
                        <div class="mt-2 inline-block text-xs font-bold px-2.5 py-0.5 rounded-full ${readingScore >= 15 ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                            Estimated Result: ${readingGrade}
                        </div>
                    </div>

                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-4">
                        <div class="text-xs font-bold uppercase text-slate-500">Task 3: Reading into Writing</div>
                        <div class="text-lg font-extrabold text-indigo-700 mt-1">${eval3.band}</div>
                        <div class="text-xs text-slate-600 mt-2">
                            TF: <strong>${eval3.tf}/4</strong> · Org: <strong>${eval3.org}/4</strong> · Lang: <strong>${eval3.lang}/4</strong>
                        </div>
                    </div>

                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-4">
                        <div class="text-xs font-bold uppercase text-slate-500">Task 4: Extended Writing</div>
                        <div class="text-lg font-extrabold text-indigo-700 mt-1">${eval4.band}</div>
                        <div class="text-xs text-slate-600 mt-2">
                            TF: <strong>${eval4.tf}/4</strong> · Org: <strong>${eval4.org}/4</strong> · Lang: <strong>${eval4.lang}/4</strong>
                        </div>
                    </div>
                </div>

                <!-- Writing Examiner Feedback -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="border border-slate-200 rounded-xl p-4 bg-white">
                        <h3 class="font-bold text-sm text-slate-900 mb-2">Task 3 Examiner Feedback (${countWords(state.task3)} words)</h3>
                        <ul class="text-xs text-slate-700 space-y-1.5">
                            ${eval3.feedback.map(f => `<li class="leading-relaxed">${f}</li>`).join("")}
                        </ul>
                    </div>
                    <div class="border border-slate-200 rounded-xl p-4 bg-white">
                        <h3 class="font-bold text-sm text-slate-900 mb-2">Task 4 Examiner Feedback (${countWords(state.task4)} words)</h3>
                        <ul class="text-xs text-slate-700 space-y-1.5">
                            ${eval4.feedback.map(f => `<li class="leading-relaxed">${f}</li>`).join("")}
                        </ul>
                    </div>
                </div>

                <!-- Detailed Question-by-Question Answer Key -->
                <div class="border border-slate-200 rounded-xl overflow-hidden">
                    <div class="bg-slate-100 px-4 py-2.5 border-b border-slate-200 font-bold text-sm text-slate-800">
                        Reading Answer Key & Text Explanations (Questions 1–30)
                    </div>
                    <div class="divide-y divide-slate-100 max-h-80 overflow-y-auto">
                        ${readingDetails.map(d => `
                            <div class="px-4 py-2.5 text-xs flex flex-col sm:flex-row sm:items-center justify-between gap-2 ${d.ok ? 'bg-white' : 'bg-rose-50/60'}">
                                <div class="space-y-0.5">
                                    <div class="font-semibold text-slate-800">
                                        <span class="inline-block w-14 text-indigo-600">${d.task} Q${d.q}</span>
                                        <span class="${d.ok ? 'text-emerald-700' : 'text-rose-700'}">Your answer: "${d.user}"</span>
                                        ${!d.ok ? `<span class="text-slate-700 ml-2">→ Correct: <strong>"${d.correct}"</strong></span>` : ''}
                                    </div>
                                    <p class="text-slate-500 pl-14">${d.explanation}</p>
                                </div>
                                <span class="shrink-0 font-bold px-2 py-0.5 rounded ${d.ok ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                                    ${d.ok ? '✓ Correct' : '✕ Incorrect'}
                                </span>
                            </div>
                        `).join("")}
                    </div>
                </div>
            `;

            // Prepare JSON payload for real Gemini AI Examiner integration
            const aiPayload = {
                exam_id: exam.id,
                level: "CEFR B2 (Trinity ISE II)",
                reading_objective_score: `${readingScore}/30`,
                writing_submissions: {
                    task3_reading_into_writing: {
                        prompt: exam.task3.prompt,
                        source_texts_summary: exam.task2.texts.map(t => `${t.id}: ${t.title}`),
                        student_response: state.task3,
                        word_count: countWords(state.task3)
                    },
                    task4_extended_writing: {
                        genre: exam.task4.genre,
                        prompt: exam.task4.prompt,
                        student_response: state.task4,
                        word_count: countWords(state.task4)
                    }
                }
            };
            document.getElementById("payloadPre").textContent = JSON.stringify(aiPayload, null, 2);

            document.getElementById("reportModal").classList.remove("hidden");
        }

        /**
         * ============================================================================
         * EVENT LISTENERS & INITIALIZATION
         * ============================================================================
         */
        function showConfirmModal(title, message, onConfirm) {
            const modal = document.getElementById("confirmModal");
            document.getElementById("confirmTitle").textContent = title;
            document.getElementById("confirmMessage").textContent = message;
            modal.classList.remove("hidden");

            const okBtn = document.getElementById("confirmOkBtn");
            const cancelBtn = document.getElementById("confirmCancelBtn");

            const cleanup = () => {
                modal.classList.add("hidden");
                okBtn.onclick = null;
                cancelBtn.onclick = null;
            };

            okBtn.onclick = () => { cleanup(); onConfirm(); };
            cancelBtn.onclick = cleanup;
        }

        window.addEventListener("DOMContentLoaded", () => {
            initExamSelector();
            loadUserState(EXAM_DATABASE[currentExamIndex].id);
            renderCurrentTab();
            updateTabBadges();
            startTimer();

            // Tab switching
            document.querySelectorAll(".tab-btn").forEach(btn => {
                btn.addEventListener("click", () => {
                    currentTab = btn.dataset.tab;
                    renderCurrentTab();
                });
            });

            // Timer controls
            document.getElementById("timerToggleBtn").addEventListener("click", (e) => {
                timerRunning = !timerRunning;
                e.target.textContent = timerRunning ? "Pause" : "Resume";
            });

            document.getElementById("timerResetBtn").addEventListener("click", () => {
                showConfirmModal("Reset Exam Timer?", "Reset the countdown back to 120:00 minutes?", () => {
                    timerSeconds = 120 * 60;
                    timerRunning = true;
                    document.getElementById("timerToggleBtn").textContent = "Pause";
                    updateTimerUI();
                });
            });

            // Clear current exam answers
            document.getElementById("clearAnswersBtn").addEventListener("click", () => {
                showConfirmModal("Clear All Answers?", "This will erase all your answers and essays for the currently selected sample exam.", () => {
                    const examId = EXAM_DATABASE[currentExamIndex].id;
                    localStorage.removeItem(getStorageKey(examId));
                    loadUserState(examId);
                    renderCurrentTab();
                    updateTabBadges();
                });
            });

            // Submit & Evaluate
            document.getElementById("submitExamBtn").addEventListener("click", () => {
                evaluateExam(false);
            });

            // Report Modal Controls
            document.getElementById("closeReportBtn").addEventListener("click", () => {
                document.getElementById("reportModal").classList.add("hidden");
            });
            document.getElementById("closeReportFooterBtn").addEventListener("click", () => {
                document.getElementById("reportModal").classList.add("hidden");
            });

            // AI Payload Modal Controls
            document.getElementById("viewPayloadBtn").addEventListener("click", () => {
                document.getElementById("payloadModal").classList.remove("hidden");
            });
            document.getElementById("closePayloadBtn").addEventListener("click", () => {
                document.getElementById("payloadModal").classList.add("hidden");
            });
            document.getElementById("copyPayloadBtn").addEventListener("click", () => {
                const text = document.getElementById("payloadPre").textContent;
                const temp = document.createElement("textarea");
                temp.value = text;
                document.body.appendChild(temp);
                temp.select();
                document.execCommand("copy");
                document.body.removeChild(temp);
                const btn = document.getElementById("copyPayloadBtn");
                btn.textContent = "✓ Copied!";
                setTimeout(() => btn.textContent = "Copy JSON", 1500);
            });
        });
